# Lo único en que la jaula de PSPP se aparta de la de R: el programa que arranca.
#
# PSPP ejecuta la sintaxis de SPSS que manda Claude (ver src/modules/r/r.spss.js).
# La unidad es una COPIA de acostaresearch-r@.service con este añadido: misma
# carpeta, sin red, sin secretos, 400 MB, 45 s. Copiada y no escrita aparte,
# para que las dos jaulas no se aparten con el tiempo.
#
# --safer quita HOST (ejecutar programas), ERASE y las tuberías; --no-statrc,
# el archivo de arranque. Los nombres de archivo TIENEN QUE COINCIDIR con
# ARGUMENTOS_PSPP de r.motor.js y con r.spss.js.
#
# Lo instala infra/r/instalar.sh en
# /etc/systemd/system/acostaresearch-r-pspp@.service.d/pspp.conf
[Unit]
Description=Acosta Research · sintaxis de SPSS en PSPP de la sesión %i

[Service]
ExecStart=
ExecStart=/usr/bin/pspp --safer --no-statrc --error-file=errores-spss.txt --output=salida-spss.txt --output=resultados-spss.odt orden.sps
