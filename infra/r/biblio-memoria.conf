# Lo único en que la jaula del mapeo bibliométrico se aparta de la de siempre.
#
# bibliometrix, cargado, ya ocupa unos 200 MB, y convertir y analizar un exporte
# de 500 documentos sube a 430 MB; de 2000, a 630 MB (medido el 21-sep-2026). La
# de siempre corta en 400 MB. El slice sigue siendo el mismo: todas las sesiones
# juntas no pasan de 1,5 GB.
#
# Lo instala infra/r/instalar.sh en
# /etc/systemd/system/acostaresearch-r-biblio@.service.d/memoria.conf
[Unit]
Description=Acosta Research · mapeo bibliométrico en R de la sesión %i

[Service]
MemoryMax=900M
